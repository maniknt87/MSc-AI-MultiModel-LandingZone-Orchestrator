trigger: none
pr: none

pool:
  name: devops-lin-agent

parameters:
- name: cloud
  type: string
  default: 'AWS'
- name: action
  type: string
  default: apply
  values: [apply, destroy]
- name: deploymentName
  type: string
  default: 'customer-ai-platform'
- name: environment
  type: string
  default: 'Development'
- name: region
  type: string
  default: 'South India'
- name: workload
  type: string
  default: 'sentiment-analysis'
- name: modelId
  type: string
  default: 'sentiment-v1'
- name: modelName
  type: string
  default: 'Sentiment Analysis'
- name: vmSize
  type: string
  default: 'ml.m5.xlarge'
- name: hubAddressSpace
  type: string
  default: '10.0.0.0/16'
- name: generalSpokeAddressSpace
  type: string
  default: '10.1.0.0/16'
- name: aiSpokeAddressSpace
  type: string
  default: '10.2.0.0/16'
- name: enableMonitoring
  type: boolean
  default: true
- name: enablePrivateEndpoint
  type: boolean
  default: true

variables:
  terraformDirectory: 'backend/terraform/aws'
  awsServiceConnection: 'AWS-Terraform-OIDC-Connection'
  # Resource names are non-secret and are kept with the pipeline definition so
  # both application-triggered and manual apply/destroy runs use the same state.
  awsTfStateBucket: 'mani-terraform-state-699754982224'
  awsTfLockTable: 'mani-terraform-lock'
  awsTfStateRegion: 'ap-south-1'

stages:
- stage: Validate
  jobs:
  - job: Validate
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        test '${{ parameters.cloud }}' = 'AWS'
        terraform fmt -check -recursive "$(terraformDirectory)"
        terraform -chdir="$(terraformDirectory)" init -backend=false -input=false
        terraform -chdir="$(terraformDirectory)" validate
      displayName: 'Validate AWS request and Terraform'

- stage: Plan
  dependsOn: Validate
  jobs:
  - job: TerraformPlan
    steps:
    - checkout: self
    - task: AWSShellScript@1
      displayName: 'Create AWS Terraform plan'
      env:
        AWS_TF_STATE_BUCKET: $(awsTfStateBucket)
        AWS_TF_LOCK_TABLE: $(awsTfLockTable)
      inputs:
        awsCredentials: '$(awsServiceConnection)'
        regionName: 'ap-south-1'
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Authenticated AWS identity: $CALLER_ARN"
          case "$CALLER_ARN" in
            arn:aws:sts::699754982224:assumed-role/AzureDevOpsTerraformOIDCRole/*) ;;
            *) echo "Unexpected AWS identity; refusing to run Terraform."; exit 1 ;;
          esac
          case '${{ parameters.region }}' in
            'South India') AWS_REGION='ap-south-1' ;;
            'US East (N. Virginia)') AWS_REGION='us-east-1' ;;
            'Europe (Ireland)') AWS_REGION='eu-west-1' ;;
            *) echo 'Region is not approved by this pipeline.'; exit 1 ;;
          esac
          STATE_BUCKET="${AWS_TF_STATE_BUCKET:-}"
          LOCK_TABLE="${AWS_TF_LOCK_TABLE:-}"
          test -n "$STATE_BUCKET"
          test -n "$LOCK_TABLE"
          case "$STATE_BUCKET" in '$('*')') echo 'awsTfStateBucket is not configured.'; exit 1 ;; esac
          case "$LOCK_TABLE" in '$('*')') echo 'awsTfLockTable is not configured.'; exit 1 ;; esac
          STATE_KEY="aws-${{ lower(parameters.deploymentName) }}-${{ lower(parameters.environment) }}.tfstate"
          ENABLE_MONITORING=$(printf '%s' '${{ parameters.enableMonitoring }}' | tr '[:upper:]' '[:lower:]')
          ENABLE_PRIVATE_ENDPOINT=$(printf '%s' '${{ parameters.enablePrivateEndpoint }}' | tr '[:upper:]' '[:lower:]')
          terraform -chdir="$(terraformDirectory)" init -reconfigure -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$(awsTfStateRegion)" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true"
          PLAN_MODE=''
          if [ '${{ parameters.action }}' = 'destroy' ]; then PLAN_MODE='-destroy'; fi
          terraform -chdir="$(terraformDirectory)" plan \
            $PLAN_MODE -input=false -out=tfplan \
            -var="aws_region=$AWS_REGION" \
            -var='deployment_name=${{ parameters.deploymentName }}' \
            -var='environment=${{ parameters.environment }}' \
            -var='workload=${{ parameters.workload }}' \
            -var='model_id=${{ parameters.modelId }}' \
            -var='model_name=${{ parameters.modelName }}' \
            -var='instance_type=${{ parameters.vmSize }}' \
            -var='hub_address_space=${{ parameters.hubAddressSpace }}' \
            -var='general_spoke_address_space=${{ parameters.generalSpokeAddressSpace }}' \
            -var='ai_spoke_address_space=${{ parameters.aiSpokeAddressSpace }}' \
            -var="enable_monitoring=${ENABLE_MONITORING}" \
            -var="enable_private_endpoint=${ENABLE_PRIVATE_ENDPOINT}"
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(terraformDirectory)/tfplan'
        artifact: 'aws-terraform-plan'

- stage: Apply
  dependsOn: Plan
  jobs:
  - deployment: TerraformApply
    environment: 'aws-${{ lower(parameters.environment) }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'aws-terraform-plan'
              targetPath: '$(Pipeline.Workspace)/aws-terraform-plan'
          - task: AWSShellScript@1
            displayName: 'Apply approved AWS plan'
            env:
              AWS_TF_STATE_BUCKET: $(awsTfStateBucket)
              AWS_TF_LOCK_TABLE: $(awsTfLockTable)
            inputs:
              awsCredentials: '$(awsServiceConnection)'
              regionName: 'ap-south-1'
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                case '${{ parameters.region }}' in
                  'South India') AWS_REGION='ap-south-1' ;;
                  'US East (N. Virginia)') AWS_REGION='us-east-1' ;;
                  'Europe (Ireland)') AWS_REGION='eu-west-1' ;;
                esac
                STATE_BUCKET="${AWS_TF_STATE_BUCKET:-}"
                LOCK_TABLE="${AWS_TF_LOCK_TABLE:-}"
                if [ '${{ parameters.action }}' = 'destroy' ]; then
                  BASE_NAME=$(printf '%s-%s' '${{ parameters.deploymentName }}' '${{ parameters.environment }}' | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')
                  for MODEL_PREFIX in sentiment ner; do
                    ENDPOINT_NAME="${MODEL_PREFIX}-${BASE_NAME}"
                    ENDPOINT_CONFIG_NAME="${MODEL_PREFIX}-config-${BASE_NAME}"
                    MODEL_NAME="${MODEL_PREFIX}-model-${BASE_NAME}"
                    if aws sagemaker describe-endpoint --endpoint-name "$ENDPOINT_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
                      aws sagemaker delete-endpoint --endpoint-name "$ENDPOINT_NAME" --region "$AWS_REGION"
                      aws sagemaker wait endpoint-deleted --endpoint-name "$ENDPOINT_NAME" --region "$AWS_REGION"
                    fi
                    if aws sagemaker describe-endpoint-config --endpoint-config-name "$ENDPOINT_CONFIG_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
                      aws sagemaker delete-endpoint-config --endpoint-config-name "$ENDPOINT_CONFIG_NAME" --region "$AWS_REGION"
                    fi
                    if aws sagemaker describe-model --model-name "$MODEL_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
                      aws sagemaker delete-model --model-name "$MODEL_NAME" --region "$AWS_REGION"
                    fi
                  done
                fi
                STATE_KEY="aws-${{ lower(parameters.deploymentName) }}-${{ lower(parameters.environment) }}.tfstate"
                terraform -chdir="$(terraformDirectory)" init -reconfigure -input=false \
                  -backend-config="bucket=$STATE_BUCKET" \
                  -backend-config="key=$STATE_KEY" \
                  -backend-config="region=$(awsTfStateRegion)" \
                  -backend-config="dynamodb_table=$LOCK_TABLE" \
                  -backend-config="encrypt=true"
                cp "$(Pipeline.Workspace)/aws-terraform-plan/tfplan" "$(terraformDirectory)/tfplan"
                terraform -chdir="$(terraformDirectory)" apply -input=false tfplan

- stage: ModelDeployment
  displayName: 'AWS AI Model Deployment'
  dependsOn: Apply
  condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'), or(eq('${{ parameters.workload }}', 'sentiment-analysis'), eq('${{ parameters.workload }}', 'named-entity-recognition')))
  jobs:
  - job: DeployAIModel
    timeoutInMinutes: 45
    steps:
    - checkout: self
    - task: AWSShellScript@1
      displayName: 'Deploy validated model to SageMaker'
      inputs:
        awsCredentials: '$(awsServiceConnection)'
        regionName: 'ap-south-1'
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          case '${{ parameters.region }}' in
            'South India') AWS_REGION='ap-south-1' ;;
            'US East (N. Virginia)') AWS_REGION='us-east-1' ;;
            'Europe (Ireland)') AWS_REGION='eu-west-1' ;;
            *) echo 'Region is not approved by this pipeline.'; exit 1 ;;
          esac
          ROLE_NAME=$(printf 'sm-%s-%s' '${{ parameters.deploymentName }}' '${{ parameters.environment }}' | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')
          EXECUTION_ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query 'Role.Arn' --output text)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          MODEL_BUCKET="ai-model-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          case '${{ parameters.workload }}' in
            'sentiment-analysis')
              MODEL_KEY="models/sentiment/v3/model.tar.gz"
              PACKAGE_SCRIPT="backend/ml/package_aws_model.py"
              DEPLOY_SCRIPT="backend/ml/deploy_aws_sentiment.py"
              ;;
            'named-entity-recognition')
              MODEL_KEY="models/ner/v1/model.tar.gz"
              PACKAGE_SCRIPT="backend/ml/package_aws_ner_model.py"
              DEPLOY_SCRIPT="backend/ml/deploy_aws_ner.py"
              ;;
            *) echo 'No SageMaker implementation exists for this workload.'; exit 1 ;;
          esac
          MODEL_DATA_URL="s3://${MODEL_BUCKET}/${MODEL_KEY}"
          python3 -m venv .aws-ml-venv
          . .aws-ml-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'boto3>=1.34,<2' 'sagemaker>=2.231,<3' 'huggingface_hub>=0.24,<2'
          python "$PACKAGE_SCRIPT" \
            --region "$AWS_REGION" \
            --bucket "$MODEL_BUCKET" \
            --key "$MODEL_KEY"
          python "$DEPLOY_SCRIPT" \
            --region "$AWS_REGION" \
            --deployment-name '${{ parameters.deploymentName }}' \
            --environment '${{ parameters.environment }}' \
            --instance-type '${{ parameters.vmSize }}' \
            --execution-role-arn "$EXECUTION_ROLE_ARN" \
            --model-data-url "$MODEL_DATA_URL"
